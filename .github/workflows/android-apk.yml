name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default package list ("tools") was removed from the SDK
      # repository, so the packages are listed explicitly here. The NDK
      # version must match $NdkVersion in android/build-apk.ps1.
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006'
          log-accepted-android-sdk-licenses: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # Prebuilt cargo-ndk binary — much faster than `cargo install cargo-ndk`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build APK
        shell: pwsh
        run: |
          $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
          .\android\build-apk.ps1 -BuildType release
          Get-ChildItem .\android\dist\*.apk | ForEach-Object {
            "APK=$($_.FullName)"
          } >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sketch3d-apk
          path: android/dist/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/*.apk
          generate_release_notes: true
